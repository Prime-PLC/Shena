name: Dev to main protection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regression-tests:
    name: PHP regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Run regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*_test.php; do
            php "$test_file"
          done